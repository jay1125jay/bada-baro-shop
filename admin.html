<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>바다에서바로 관리자</title>
  <style>
    body{font-family:Arial,'Noto Sans KR',sans-serif;margin:0;background:#f4f6f7;color:#17232c}.wrap{width:min(1100px,calc(100% - 32px));margin:40px auto}.head{display:flex;justify-content:space-between;gap:16px;align-items:center;margin-bottom:24px}.head h1{margin:0;color:#0b2b46}.head a,.head button{background:#0b2b46;color:#fff;border:0;text-decoration:none;padding:12px 16px;border-radius:4px;font-weight:700;cursor:pointer}.sub{color:#67737b;font-size:14px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:18px}.card{background:#fff;padding:20px;border:1px solid #e1e6e9;border-radius:8px}.card h2{font-size:18px;color:#0b2b46;margin:0 0 14px}.field{margin-bottom:12px}.field label{display:block;font-size:12px;font-weight:700;margin-bottom:5px;color:#5d6972}.field input,.field textarea{width:100%;box-sizing:border-box;padding:10px;border:1px solid #ccd5da;border-radius:4px;font:inherit}.field textarea{min-height:82px;resize:vertical}.preview{width:100%;aspect-ratio:16/9;background:#e8eef1;display:grid;place-items:center;overflow:hidden;margin-bottom:12px}.preview img{width:100%;height:100%;object-fit:cover}.actions{display:flex;gap:10px;margin-top:22px}.secondary{background:#fff!important;color:#0b2b46!important;border:1px solid #0b2b46!important}.notice{margin:18px 0;background:#fff7e9;border:1px solid #ead4a6;padding:14px;border-radius:6px;font-size:13px;color:#6b5b36}@media(max-width:760px){.grid{grid-template-columns:1fr}.head{align-items:flex-start;flex-direction:column}.actions{flex-wrap:wrap}}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="head">
      <div><h1>바다에서바로 관리자</h1><div class="sub">상품명·설명·가격·배지·사진 수정</div></div>
      <a href="index.html">사이트 보기</a>
    </div>
    <div class="notice">현재 버전은 MVP입니다. 변경 내용은 같은 브라우저의 localStorage에 저장됩니다. 운영용 관리자 계정·DB·이미지 저장소는 다음 단계에서 Supabase로 전환합니다.</div>
    <div class="grid" id="editorGrid"></div>
    <div class="actions"><button id="saveBtn">전체 저장</button><button id="resetBtn" class="secondary">기본값 복원</button></div>
  </div>
  <script src="admin.js"></script>
</body>
</html>
